[project]
name = "chronos"
version = "0.1.0"
description = "Chronos-AI: behavioural wake detection + morning reel API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.54",
  "sqlmodel==0.0.48",
  "alembic==1.20.0",
  "structlog==26.1.0",
  "typer==0.27.3",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "ruff==0.16.10",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "hypothesis==6.168.5",
  "time-machine==3.5.1",
]

[project.scripts]
chronos = "chronos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chronos"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # starlette 1.7.0 deprecates httpx in favour of httpx2; httpx is still functional
  "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
  "ollama: requires local Ollama service",
  "kokoro: requires Kokoro TTS model",
  "whisper: requires whisper.cpp binary",
  "remotion: requires Remotion browser",
]

# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "B", "C4", "PTH", "RUF"]
ignore = [
  "S101",   # assert allowed in tests
  "S603",   # subprocess calls reviewed per AGENTS.md
  "S607",   # partial path in subprocess — same
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

# ── pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
