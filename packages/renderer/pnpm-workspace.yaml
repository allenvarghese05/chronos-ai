# pnpm 12.x project-level settings for packages/renderer.
# nodeLinker=hoisted for consistency with apps/mobile; also ensures that
# Remotion's internal React resolution works without symlinking surprises.
nodeLinker: hoisted

allowBuilds:
  esbuild: true

# Keep Remotion's Zod4 graph on the patched collection-validation release.
overrides:
  "zod@>=4 <4.6.6": 4.6.6
