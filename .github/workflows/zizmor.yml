# Static analysis of the workflows themselves (template injection, unpinned actions, excessive
# permissions). Plain output (code scanning/SARIF needs GitHub Advanced Security, which this private
# repo does not have). Not a required check.
name: zizmor

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    branches: [main]
    paths: [".github/**"]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.18"
      - name: Run zizmor (pedantic, fails on any finding)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # lets zizmor resolve action SHAs online
        run: uvx zizmor==1.9.0 --persona pedantic --no-progress --format plain .github/workflows
