# Static analysis of the workflows themselves (template injection, unpinned actions, excessive
# permissions). Results go to code scanning. Not a required check.
name: zizmor

on:
  push:
    branches: [main]
    paths: [".github/**"]
  pull_request:
    branches: [main]
    paths: [".github/**"]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload SARIF results to code scanning
      contents: read # check out the code
      actions: read # read workflow run metadata
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          min-severity: low
          persona: pedantic
