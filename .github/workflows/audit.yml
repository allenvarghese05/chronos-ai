# Weekly dependency audit (pip-audit, pnpm audit). Advisory databases change without code changes,
# so this is never a required check. An unreachable registry is a skip (justfile).
name: Audit

on:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      UV_PROJECT_ENVIRONMENT: .venv
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable corepack
        run: corepack enable
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock
      - name: Install just
        run: |
          uv tool install rust-just==1.58.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Python dependencies (just security-py)
        run: just security-py
      - name: JS dependencies (just security-web)
        if: ${{ !cancelled() }}
        run: just security-web
      # Informational: list ALL advisories including those suppressed via auditConfig.ignoreGhsas
      # in pnpm-workspace.yaml. pnpm has no flag to bypass ignoreGhsas, so ignored IDs are
      # listed explicitly here (see docs/decisions/D31-pnpm-audit-ignores.md). Non-failing.
      - name: JS audit informational (ignored advisories visible)
        if: ${{ !cancelled() }}
        run: |
          IGNORED='GHSA-86w9-cpqp-85rv (node-forge HIGH) GHSA-vfj7-8cjw-p6xm (braces HIGH) GHSA-hp3w-g68c-fv3c (sprintf-js MODERATE)'
          for app_dir in apps/mobile packages/renderer; do
            [ -f "${app_dir}/package.json" ] || continue
            echo "=== pnpm audit informational: ${app_dir} ==="
            (cd "${app_dir}" && pnpm audit --json | python3 -c 'import json,sys; d=json.load(sys.stdin); [print("  ["+v.get("severity","?")+"] "+v.get("title","?")+" "+v.get("url","")) for v in d.get("advisories",{}).values()]; print("  "+str(len(d.get("advisories",{})))+" non-ignored advisory/ies shown above")' || true)
            echo "  suppressed via ignoreGhsas (no patched version, see D31): ${IGNORED}"
          done
