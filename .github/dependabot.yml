# Policy: github-actions SHA pins are bumped weekly (keeps CI actions current).
# pip and npm: security updates ONLY. Version updates are disabled via
# open-pull-requests-limit: 0 — GitHub Dependabot ignores this limit for security
# updates, so CVE-triggered PRs still open; routine version bumps do not.
# Lockfile changes for pip/npm happen deliberately inside feature tasks (D19, D33).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build(api)
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build(mobile)
    groups:
      mobile-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /packages/renderer
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: build(renderer)
    groups:
      renderer-security:
        applies-to: security-updates
        patterns: ["*"]
