# pnpm 12.x project-level settings.
# nodeLinker=hoisted makes pnpm produce a flat node_modules layout (like npm),
# which is required for Metro (React Native's bundler) because Metro does not
# follow symlinks. It also ensures that transitive dependencies such as
# expo-modules-core are hoisted to the top-level node_modules so TypeScript and
# the local chronos-sensors module can resolve them without listing the package
# as a direct dependency (which expo-doctor rejects).
# See: https://pnpm.io/settings#nodelinker
nodeLinker: hoisted
