# pnpm 12.x project-level settings.
# nodeLinker=hoisted makes pnpm produce a flat node_modules layout (like npm),
# which is required for Metro (React Native's bundler) because Metro does not
# follow symlinks. It also ensures that transitive dependencies such as
# expo-modules-core are hoisted to the top-level node_modules so TypeScript and
# the local chronos-sensors module can resolve them without listing the package
# as a direct dependency (which expo-doctor rejects).
# See: https://pnpm.io/settings#nodelinker
nodeLinker: hoisted

# Audit advisories to ignore. These are HIGH/MODERATE vulnerabilities in Expo
# SDK's build tools (@expo/cli, Metro bundler) for which no patched versions
# exist. They are NOT in the app's runtime code. Review when Expo SDK is upgraded.
#
#   GHSA-86w9-cpqp-85rv: node-forge RSA bypass — in @expo/cli, no patch
#   GHSA-vfj7-8cjw-p6xm: braces ReDoS — in Metro bundler, no patch
#   GHSA-hp3w-g68c-fv3c: sprintf-js DoS — in argparse (test tooling), no patch
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-hp3w-g68c-fv3c

# SDK57 CLI devtools schemas use APIs retained by patched Zod4.
overrides:
  "@expo/cli>zod": 4.6.6
  "query-string@7.1.3>decode-uri-component": 0.5.1

patchedDependencies:
  decode-uri-component@0.5.1: patches/decode-uri-component@0.5.1.patch
